apiVersion: apps/v1
kind: Deployment
metadata:
  name: campusfix
  namespace: campusfix
spec:
  replicas: 2
  selector:
    matchLabels:
      app: campusfix
  template:
    metadata:
      labels:
        app: campusfix
    spec:
      containers:
      - name: campusfix
        image: campusfix:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5000
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 20
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
